<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="EducRespi — application de respiration guidée.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>EducRespi — respiration guidée</title>
</head>
<body>
  <noscript><p class="noscript">EducRespi a besoin de JavaScript pour fonctionner. Activez-le dans votre navigateur.</p></noscript>

  <main class="app" id="app">
    <header class="app-header">
      <h1>EducRespi</h1>
      <p>Respiration guidée</p>
    </header>
    <section class="stage" aria-label="Visualisation de la respiration">
      <div class="ring" aria-hidden="true"></div>
      <div class="bubble" id="bubble" aria-hidden="true"></div>
      <div class="overlay">
        <span id="phase-label" role="status" aria-live="polite">Prêt</span>
        <span id="phase-timer">0.0</span>
        <span id="cycle-count">Cycle 0</span>
      </div>
    </section>

    <section class="panel" aria-label="Réglages de la séance">
      <div class="phase-grid">
        <div class="field"><label for="inhale">Inspiration (s)</label><input id="inhale" type="number" value="5" min="1" max="60" step="0.5" inputmode="decimal"></div>
        <div class="field"><label for="hold-full">Suspension pleine (s)</label><input id="hold-full" type="number" value="0" min="0" max="60" step="0.5" inputmode="decimal"></div>
        <div class="field"><label for="exhale">Expiration (s)</label><input id="exhale" type="number" value="5" min="1" max="60" step="0.5" inputmode="decimal"></div>
        <div class="field"><label for="hold-empty">Suspension vide (s)</label><input id="hold-empty" type="number" value="0" min="0" max="60" step="0.5" inputmode="decimal"></div>
      </div>

      <div class="setting-row">
        <label for="duration">Durée de séance (min)</label>
        <input id="duration" type="number" value="5" min="1" max="120" step="1" inputmode="numeric">
      </div>

      <div class="setting-row volume-row">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" value="70">
      </div>

      <div class="sound-row">
        <label class="check-label"><input id="sound-enabled" type="checkbox" checked> Son activé</label>
        <label class="sr-only" for="sound-mode">Ambiance sonore</label>
        <select id="sound-mode">
          <option value="pad">Nappe harmonique</option>
          <option value="gong">Gongs de transition</option>
          <option value="wave">Bruit de vagues</option>
        </select>
      </div>

      <div class="buttons">
        <button class="button primary" id="start" type="button">Démarrer</button>
        <button class="button pause" id="pause" type="button" hidden>Pause</button>
        <button class="button stop" id="stop" type="button" hidden>Arrêter</button>
      </div>
      <p id="remaining" role="timer" aria-live="off">Temps restant : 05:00</p>

      <section class="presets" aria-label="Séances enregistrées">
        <div class="preset-entry">
          <label class="sr-only" for="preset-name">Nom de la séance</label>
          <input id="preset-name" type="text" maxlength="25" placeholder="Nom (ex. Matin)">
          <button id="save-preset" type="button">Enregistrer (0/10)</button>
        </div>
        <p id="preset-status" role="status" aria-live="polite"></p>
        <ul id="preset-list" class="preset-list"></ul>
      </section>
      <p class="help">Espace : démarrer / pause · Échap : arrêter</p>
    </section>
    <footer class="app-footer">Version 1.1.2</footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
